<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学员管理平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=20260911a" />
  <style>
    /* 全屏登录门禁：未登录锁定整个应用 */
    body.auth-locked { overflow: hidden; }
    body.auth-locked .app { display: none !important; }
    #auth-gate { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #fafafa, #eef0f4); }
    body.auth-locked #auth-gate { display: flex; }
    .ag-card { width: 360px; max-width: 92vw; background: #fff; border: 1px solid #e4e4e7; border-radius: 14px;
      padding: 28px 26px; box-shadow: 0 10px 40px rgba(15, 23, 42, .10); font-family: Inter, system-ui, -apple-system, sans-serif; }
    .ag-brand { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
    .ag-mark { width: 38px; height: 38px; border-radius: 10px; background: #4F46E5; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .ag-title { font-weight: 600; color: #18181b; }
    .ag-sub { font-size: 12px; color: #71717a; }
    .ag-form { display: flex; flex-direction: column; gap: 12px; }
    .ag-fld { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #3f3f46; }
    .ag-fld input { height: 40px; border: 1px solid #d4d4d8; border-radius: 8px; padding: 0 12px; font-size: 14px; outline: none; }
    .ag-fld input:focus { border-color: #4F46E5; box-shadow: 0 0 0 3px rgba(79, 70, 229, .15); }
    .ag-btn { position: relative; height: 42px; border: 0; border-radius: 8px; background: #4F46E5; color: #fff; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .ag-btn:disabled { opacity: .7; cursor: default; }
    .ag-btn.loading { pointer-events: none; }
    .ag-btn.success { background: #16a34a; }
    .ag-btn-ghost { height: 38px; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: #4F46E5; font-weight: 600; cursor: pointer; }
    .ag-btn-ghost:hover { background: #f5f5f7; }
    .ag-spinner { width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, .5); border-top-color: #fff; border-radius: 50%; animation: agspin .7s linear infinite; }
    @keyframes agspin { to { transform: rotate(360deg); } }
    .ag-err { color: #dc2626; font-size: 13px; }
    .ag-ok { color: #16a34a; font-size: 13px; }
    .ag-offline { color: #71717a; font-size: 13px; line-height: 1.6; }
    /* 登录态/退出已移入左侧栏底部账户区（见 .sidebar-foot .sf-*），不再用右上角悬浮条遮挡内容 */
  </style>
</head>
<body class="auth-locked">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">学</div>
        <div>
          <div class="brand-name">学员管理平台</div>
          <div class="brand-sub">Student Management Platform</div>
        </div>
      </div>
      <div class="nav-label">闭环流程</div>
      <div class="nav-item active" data-nav="students"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>学员</span></div>
      <div class="nav-item" data-nav="enroll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>入学诊断</span></div>
      <div class="nav-item" data-nav="suggest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z"/></svg><span>教学建议</span></div>
      <div class="nav-item" data-nav="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16M4 5h16M4 12h16"/></svg><span>课程规划</span></div>
      <div class="nav-item" data-nav="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/></svg><span>学情记录</span></div>
      <div class="nav-item" data-nav="stage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span>阶段诊断</span></div>
      <div class="nav-item" data-nav="archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg><span>成长档案</span></div>
      <div class="nav-label">数据底座</div>
      <div class="nav-item" data-nav="db"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4M3 7v10l9 4 9-4V7"/><path d="M3 12l9 4 9-4"/></svg><span>数据库</span></div>
      <div class="sidebar-foot">
        <div class="nav-item" id="themeToggle" style="cursor:pointer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><span>深浅色切换</span></div>
        <div class="nav-item" id="exportAll" style="cursor:pointer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><span>数据说明</span></div>
      </div>
      <div class="sidebar-foot" id="auth-foot"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><h1 id="pageTitle">学员管理平台</h1><span class="crumb" id="pageCrumb"></span></div>
        <div class="top-actions" id="topActions"></div>
      </header>
      <div class="content" id="view"></div>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div class="toast" id="toast"></div>

  <!-- 全屏登录门禁（未登录时锁定整个应用） -->
  <div id="auth-gate">
    <div class="ag-card">
      <div class="ag-brand">
        <div class="ag-mark">学</div>
        <div>
          <div class="ag-title">学员管理平台</div>
          <div class="ag-sub">登录后使用 · 数据受行级权限保护</div>
        </div>
      </div>
      <form id="ag-form" class="ag-form" onsubmit="return false">
        <label class="ag-fld"><span>邮箱</span><input id="sp-email" type="email" autocomplete="username" placeholder="you@school.edu"></label>
        <label class="ag-fld"><span>密码</span><input id="sp-pass" type="password" autocomplete="current-password" placeholder="••••••••"></label>
        <button id="sp-login" class="ag-btn" type="button">
          <span class="ag-spinner" style="display:none"></span>
          <span class="ag-btn-label">登录</span>
        </button>
        <button id="sp-signup" class="ag-btn-ghost" type="button">注册新账号</button>
        <div id="sp-err" class="ag-err" style="display:none"></div>
        <div id="sp-ok" class="ag-ok" style="display:none"></div>
      </form>
      <div id="ag-offline" class="ag-offline" style="display:none">
        未配置后端（config.js 缺 SUPABASE_URL / ANON_KEY）。
      </div>
    </div>
  </div>

  <script src="js/config.js?v=20260912b"></script>
  <script src="js/engine.js?v=20260911a"></script>
  <script src="js/store.js?v=20260911a"></script>
  <script src="js/ai.js?v=20260912b"></script>
  <script src="js/app.js?v=20260912b"></script>
  <script src="js/auth-gate.js?v=20260914a"></script>
</body>
</html>
